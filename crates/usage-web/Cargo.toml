[package]
name = "usage-web"
version = "0.1.0"
edition = "2021"
description = "Serves the panel as a password-protected web page (sandbox accounts only)"
publish = false

[[bin]]
name = "ai-usage-web"
path = "src/main.rs"

[dependencies]
usage-core = { path = "../usage-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
