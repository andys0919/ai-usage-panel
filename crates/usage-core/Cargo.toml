[package]
name = "usage-core"
version = "0.1.0"
edition = "2021"
description = "Reads 5h / weekly usage for Claude, Codex and Gemini (Antigravity) accounts managed by Orca"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form", "system-proxy"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
futures = "0.3"
