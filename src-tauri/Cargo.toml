[package]
name = "ai-usage-panel"
version = "0.1.0"
edition = "2021"
description = "Desktop panel showing the 5h / weekly usage of every Claude, Codex and Gemini account"
publish = false
default-run = "ai-usage-panel"

[lib]
name = "ai_usage_panel_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
usage-core = { path = "../crates/usage-core" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
